<body>
<div style="max-width: 500px; margin: 0 auto;">

    <div style="color: #212121; line-height: 1.375; margin: 16px 0; text-align: justify;"><span th:text="${type}"></span> 요청에 따라 아래 인증번호를 전송하였습니다. 본인이 요청한게 아니라면 해당 이메일을 안전하게 삭제해 주시고, 절대로 아래 인증번호를 타인에게 알려주어서는 안 됩니다.</div>
    <code style="background-color: #fafbff; color: #4678ffe0; cursor: pointer; display: block; font-size: 14pt; letter-spacing: 12px; padding: 10px 20px; text-align: center; user-select: all; font-family: 'Roboto Mono', monospace" th:text="${code}">000000</code>
    <div style="color: #212121; line-height: 1.375; margin: 16px 0; text-align: justify;">기타 문의 사항은 <a href="#">고객 센터</a>를 통해 남겨주시기 바랍니다. 감사합니다.</div>
