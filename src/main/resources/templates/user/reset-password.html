<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정 - 끼리끼리</title>
    <link rel="stylesheet" href="/assets/styles/fragments.css">
    <link rel="stylesheet" href="/user/assets/styles/find.css">
    <script defer src="/assets/scripts/dialog.js"></script>
    <script defer src="/user/assets/scripts/reset-password.js"></script>
</head>
<body>
<th:block th:replace="~{fragments/common :: dialog}"></th:block>

<div class="find-container">
    <div class="find-box">
        <h1 class="logo"><a href="/">끼리끼리</a></h1>

        <h2>새 비밀번호 설정</h2>
        <p class="desc">안전한 계정 사용을 위해 <br>새로운 비밀번호를 입력해 주세요.</p>

        <input type="hidden" id="resetEmail" th:value="${email}">
        <input type="hidden" id="resetToken" th:value="${token}">

        <div class="input-group">
            <label>
                <span class="screen-reader-only">새 비밀번호</span>
                <input type="password" id="newPassword" placeholder="새 비밀번호 (8자 이상, 특수문자 포함)">
            </label>
        </div>

        <div class="input-group">
            <label>
                <span class="screen-reader-only">비밀번호 확인</span>
                <input type="password" id="confirmPassword" placeholder="새 비밀번호 확인">
            </label>
        </div>

        <button type="button" id="btnResetPassword" class="btn-submit">비밀번호 변경하기</button>
    </div>
</div>
</body>
</html>
