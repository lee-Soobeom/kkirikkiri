<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>끼리끼리</title>
    <link rel="stylesheet" href="/assets/styles/common.css" type="text/css">
    <link rel="stylesheet" href="/assets/styles/fragments.css" type="text/css">
    <link rel="stylesheet" href="/assets/styles/home.css" type="text/css">
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=92c55423409f256ecb1626e5dbd939a0&libraries=services"></script>
    <script defer src="/assets/scripts/dialog.js" type="text/javascript"></script>
    <script defer src="/assets/scripts/common.js" type="text/javascript"></script>
    <script defer src="/assets/scripts/home.js" type="text/javascript"></script>
</head>
<body>
<th:block th:replace="~{/fragments/common.html :: topNavigator}"></th:block>
<th:block th:replace="~{/fragments/common.html :: sideMypage(${session.sessionUser})}"></th:block>
<th:block th:replace="~{/fragments/common.html :: dialog}"></th:block>
<main id="main">
    <div class="search">
        <div class="menu-container">
            <label class="label">
                <input hidden checked class="input" type="radio" name="menuFilter" value="all"
                th:checked="${menu == 'all'}"
                th:onclick="|location.href='/'|">
                <span class="menu">
                    <img class="icon" src="/assets/images/main/main.menu.all.png" alt="">
                </span>
                <span class="caption">#전체</span>
            </label>
            <label class="label">
                <input hidden class="input" type="radio" name="menuFilter" value="chicken"
                th:checked="${menu == 'chicken'}"
                th:onclick="|location.href='/?menu=chicken'|">
                <span class="menu">
                    <img class="icon" src="/assets/images/main/main.menu.chicken.png" alt="">
                </span>
                <span class="caption">#치킨</span>
            </label>
            <label class="label">
                <input hidden class="input" type="radio" name="menuFilter" value="pizza"
                th:checked="${menu == 'pizza'}"
                th:onclick="|location.href='/?menu=pizza'|">
                <span class="menu">
                    <img class="icon" src="/assets/images/main/main.menu.pizza.png" alt="">
                </span>
                <span class="caption">#피자</span>
            </label>
            <label class="label">
                <input hidden class="input" type="radio" name="menuFilter" value="hamburger"
                th:checked="${menu == 'hamburger'}"
                th:onclick="|location.href='/?menu=hamburger'|">
                <span class="menu">
                    <img class="icon" src="/assets/images/main/main.menu.hamburger.png" alt="">
                </span>
                <span class="caption">#햄버거</span>
            </label>
            <label class="label">
                <input hidden class="input" type="radio" name="menuFilter" value="stew"
                th:checked="${menu == 'stew'}"
                th:onclick="|location.href='/?menu=stew'|">
                <span class="menu">
                    <img class="icon" src="/assets/images/main/main.menu.stew.png" alt="">
                </span>
                <span class="caption">#찜/탕</span>
            </label>
            <label class="label">
                <input hidden class="input" type="radio" name="menuFilter" value="japanese-food"
                th:checked="${menu == 'japanese-food'}"
                th:onclick="|location.href='/?menu=japanese-food'|">
                <span class="menu">
                    <img class="icon" src="/assets/images/main/main.menu.japanese-food.png" alt="">
                </span>
                <span class="caption">#회/일식</span>
            </label>
            <label class="label">
                <input hidden class="input" type="radio" name="menuFilter" value="chinese-food"
                th:checked="${menu == 'chinese-food'}"
                th:onclick="|location.href='/?menu=chinese-food'|">
                <span class="menu">
                    <img class="icon" src="/assets/images/main/main.menu.chinese-food.png" alt="">
                </span>
                <span class="caption">#중식</span>
            </label>
            <label class="label">
                <input hidden class="input" type="radio" name="menuFilter" value="western-food"
                th:checked="${menu == 'western-food'}"
                th:onclick="|location.href='/?menu=western-food'|">
                <span class="menu">
                    <img class="icon" src="/assets/images/main/main.menu.western-food.png" alt="">
                </span>
                <span class="caption">#양식</span>
            </label>
            <label class="label">
                <input hidden class="input" type="radio" name="menuFilter" value="dessert"
                th:checked="${menu == 'dessert'}"
                th:onclick="|location.href='/?menu=dessert'|">
                <span class="menu">
                    <img class="icon" src="/assets/images/main/main.menu.dessert.png" alt="">
                </span>
                <span class="caption">#디저트</span>
            </label>
            <label class="label">
                <input hidden class="input" type="radio" name="menuFilter" value="etc"
                th:checked="${menu == 'etc'}"
                th:onclick="|location.href='/?menu=etc'|">
                <span class="menu">
                    <img class="icon" src="/assets/images/main/main.menu.etc.png" alt="">
                </span>
                <span class="caption">#그 외</span>
            </label>
        </div>
    </div>
    <h2 class="title">마감이 30분 남았어요! 빠르게 주문해보세요!</h2>
    <div class="group">
        <ol class="list">
            <li class="loading -hidden">
                <img class="image" src="/assets/images/loading.png" alt="">
                <span>loading...</span>
            </li>
            <li class="empty -hidden">
                <span class="caption">주변에 공동구매 게시글이 없습니다. <br> 게시글을 작성하러 이동하시겠습니까? <a class="link" href="/article/share/write" target="_self">이동하기</a></span>
            </li>
        </ol>
    </div>
</main>
<ol id="quick-nav">
    <li class="item">
        <a class="link" th:href="@{/board/list(id='share')}" target="_self">공구</a>
    </li>
    <li class="item">
        <a class="link" th:href="@{/board/list(id='promote')}" target="_self">홍보</a>
    </li>
    <li class="item">
        <a class="link" th:href="@{/board/list(id='notice')}" target="_self">공지</a>
    </li>
    <li class="item">
        <label class="label">
            <span class="caption">게시판</span>
            <input hidden class="input" type="checkbox"/>
        </label>
    </li>
</ol>
</body>
</html>
