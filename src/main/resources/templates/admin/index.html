<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>관리자 대시보드</title>
    <link rel="shortcut icon" href="/assets/images/favicon.png">
    <link rel="stylesheet" href="/assets/styles/fragments.css">
    <link rel="stylesheet" href="/user/assets/styles/admin.css">
    <script defer src="/assets/scripts/dialog.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="/user/assets/scripts/admin.js"></script>
</head>
<body>
<th:block  th:replace="~{fragments/common.html :: dialog}"></th:block>

<div class="admin-layout">
    <th:block  th:replace="~{fragments/admin-common.html :: sidebar(${currentMenu})}"></th:block>

    <main class="admin-main">
        <th:block th:switch="${currentMenu}">

            <div th:case="'dashboard'">
                <th:block th:block th:replace="~{admin/sections/dashboard :: dashboardSection}"></th:block>
            </div>

            <div th:case="'approval'">
                <th:block th:block th:replace="~{admin/sections/approval-table :: approvalSection}"></th:block>
            </div>

            <div th:case="'user'">
                <th:block th:block th:replace="~{admin/sections/user-table :: userSection}"></th:block>
            </div>

            <div th:case="'content'">
                <h2>콘텐츠/리뷰 관리</h2>
                <p>부적절한 리뷰나 게시글을 필터링합니다. (준비 중)</p>
            </div>

            <div th:case="'notice'">
                <th:block th:replace="~{admin/sections/notice-table :: noticeSection}"></th:block>
            </div>

            <div th:case="'support'">
                <h2>문의/고객센터</h2>
                <p>사용자들의 1:1 문의 내역을 확인하고 답변합니다. (준비 중)</p>
            </div>

        </th:block>
    </main>
</div>
</body>
</html>
