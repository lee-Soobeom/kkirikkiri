<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>회원 관리</title>
    <link rel="stylesheet" href="/assets/styles/fragments.css">
    <link rel="stylesheet" href="/user/assets/styles/admin.css">
    <script defer src="/assets/scripts/dialog.js"></script>
    <script defer src="/user/assets/scripts/admin.js"></script>
</head>
<body>
<div th:fragment="userSection" class="boss-container">
    <h2>회원 관리</h2>
    <div class="dashboard-cards">
        <div class="card card-primary">
            <div class="card-label">전체 회원 수</div>
            <div class="card-value" th:text="${totalUserCount} + '명'">1,234명</div>
        </div>
        <div class="card card-success">
            <div class="card-label">오늘 가입자</div>
            <div class="card-value" th:text="${todayJoinCount} + '명'">12명</div>
        </div>
    </div>

    <div class="search-wrapper">
        <form th:action="@{/admin/index}" method="get">
            <input type="hidden" name="menu" value="user">

            <label>
                <span class="screen-reader-only">검색 조건</span>
                <select name="searchType">
                    <option value="all">전체 검색</option>
                    <option value="nickname">닉네임</option>
                    <option value="email">이메일</option>
                </select>
            </label>

            <label>
                <span class="screen-reader-only">검색어 입력</span>
                <input type="text" name="keyword" placeholder="검색어를 입력하세요">
            </label>

            <button type="submit">검색</button>
        </form>
    </div>
    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>로그인 구분</th>
                <th>권한</th>
                <th>등급</th>
                <th>성인 구분</th>
                <th>이메일 / 연락처</th>
                <th>이름 (별명/상호)</th>
                <th>가입일 (최근접속)</th>
                <th>상태</th>
                <th>관리 액션</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${userList}">
                <td>
                    <span th:if="${user.socialTypeCode != null and user.socialTypeCode.toUpperCase() == 'KAKAO'}"
                          class="badge" style="background: #fee500; color: #3c1e1e;">카카오
                    </span>
                    <span th:if="${user.socialTypeCode != null and user.socialTypeCode.toUpperCase() == 'NAVER'}"
                          class="badge" style="background: #03c75a; color: white;">네이버
                    </span>
                    <span th:if="${user.socialTypeCode != null and user.socialTypeCode.toUpperCase() == 'LOCAL'}"
                          class="badge" style="background: #858796; color: white;">일반
                    </span>
                </td>
                <td th:text="${user.admin ? '관리자' : (user.boss ? '사장님' : '회원')}">회원</td>
                <td>
                    <span th:if="${user.status == 'VIP'}" class="badge vip">우수</span>
                    <span th:if="${user.status != 'VIP'}" class="badge normal">일반</span>
                </td>
                <td>
                    <span th:class="'badge ' + (${user.isAdult} ? 'adult' : 'minor')" th:text="${user.isAdult ? '성인' : '미성년'}">성인</span>
                </td>
                <td>
                    <div th:text="${user.email}">user@email.com</div>
                    <div style="font-size: 0.75rem; color: #858796;" th:text="${user.contact}">010-1234-5678</div>
                </td>
                <td>
                    <div style="font-weight: bold;" th:text="${user.name}">홍길동</div>
                    <div style="font-size: 0.75rem; color: #858796;" th:text="'(' + ${user.nickname} + ')'"></div>
                </td>
                <td>
                    <div th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">2026-02-25</div>
                    <div style="font-size: 0.75rem; color: #858796;" th:text="'(' + ${#temporals.format(user.lastLoginAt, 'MM-dd HH:mm')} + ')'">(02-25 11:30)</div>
                </td>
                <td>
                    <span th:class="'badge ' + ${user.status == 'BLACK' ? 'black' : 'approved'}"
                          th:text="${user.status == 'BLACK' ? '블랙' : '정상'}">정상</span>
                </td>

                <td>
                    <div class="btn-group">
                        <button type="button" class="btn-grade"
                                th:title="${user.status == 'VIP' ? '일반' : '우수로 승격'}">
                            <span th:text="${user.status == 'VIP' ? '🌟' : '⭐'}">⭐</span>
                        </button>

                        <button type="button" class="btn-reject"
                                th:data-email="${user.email}"
                                th:data-status="${user.status}"
                                th:text="${user.status == 'BLACK' ? '해제' : '차단'}"
                                th:style="${user.status == 'BLACK' ? 'background-color: #4e73df; color: white; border: none;' : ''}">
                            차단
                        </button>
                    </div>
                </td>

            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
