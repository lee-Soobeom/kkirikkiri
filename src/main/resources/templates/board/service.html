<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>끼리끼리 - 고객센터</title>
    <link rel="stylesheet" href="/assets/styles/common.css" type="text/css">
    <link rel="stylesheet" href="/assets/styles/fragments.css" type="text/css">
    <link rel="stylesheet" href="/board/assets/styles/service.css" type="text/css">
    <link rel="shortcut icon" href="/assets/images/favicon.png">
    <script defer src="/board/assets/scripts/service.js" type="text/javascript"></script>
</head>
<body>
<th:block th:replace="~{/fragments/common.html :: topNavigator}"></th:block>
<th:block th:replace="~{/fragments/common.html :: sideMypage"></th:block>
<main id="main">
    <h2 class="title">고객센터</h2>
    <form class="search" name="searchForm">
        <label class="label">
            <input spellcheck="false" autocomplete="off" class="input" type="text" maxlength="10" minlength="1"
                   name="search" placeholder="찾고싶은 서비스를 검색하세요.">
            <button class="button" type="submit">
                <img class="image" src="/assets/images/main/main.menu.search.png" alt="">
            </button>
        </label>
    </form>
    <ol class="filter-container">
        <li class="filter">
            <a href="/board/service?page=1&filter=all"
               th:class="${filter == 'all' ? 'link -selected' : 'link'}">전체</a>
        </li>
        <li class="filter">
            <a href="/board/service?page=1&filter=pay"
               th:class="${filter == 'pay' ? 'link -selected' : 'link'}">결제/환불</a>
        </li>
        <li class="filter">
            <a href="/board/service?page=1&filter=user"
               th:class="${filter == 'user' ? 'link -selected' : 'link'}">사용자 계정/프로필</a>
        </li>
        <li class="filter">
            <a href="/board/service?page=1&filter=event"
               th:class="${filter == 'event' ? 'link -selected' : 'link'}">이벤트/혜택</a>
        </li>
        <li class="filter">
            <a href="/board/service?page=1&filter=restrict"
               th:class="${filter == 'restrict' ? 'link -selected' : 'link'}">이용제한</a>
        </li>
    </ol>
    <a class="link" href="/service/write" target="_self">글쓰기</a>
    <ol class="question-container">
        <li class="question" th:each=" service : ${services}" th:attr="data-id=${service.id}">
            <span class="title">Q. <span th:text="${service.question}"></span></span>
            <span class="filter">#<span th:text="${service.filterDisplayText}"></span></span>
        </li>
    </ol>
    <div class="page-container">
        <div class="group">
            <a th:class="${boardPageVo.requestPage == boardPageVo.minPage ? 'link -disabled' : 'link'}"
               th:href="@{'/board/service' (page = ${boardPageVo.minPage})}">&lt;&lt;</a>
            <a th:class="${boardPageVo.requestPage == boardPageVo.minPage ? 'link -disabled' : 'link'}"
               th:href="@{'/board/service' (page = ${boardPageVo.requestPage - 1})}">&lt;</a>
        </div>
        <div class="group">
            <a th:each=" page : ${#numbers.sequence(boardPageVo.startPage, boardPageVo.endPage)}"
               th:text="${page}"
               th:href="@{'/board/service' (page = ${page})}"
               th:class=" ${boardPageVo.requestPage == page} ? 'link -selected' : 'link' "></a>
        </div>
        <div class="group">
            <a th:class="${boardPageVo.requestPage == boardPageVo.maxPage ? 'link -disabled' : 'link'}"
               th:href="@{'/board/service' (page = ${boardPageVo.requestPage + 1})}">&gt;</a>
            <a th:class="${boardPageVo.requestPage == boardPageVo.maxPage ? 'link -disabled' : 'link'}"
               th:href="@{'/board/service' (page = ${boardPageVo.maxPage})}">&gt;&gt;</a>
        </div>
    </div>
</main>
</body>
</html>
