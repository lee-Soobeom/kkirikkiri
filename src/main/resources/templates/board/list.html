<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>게시판 목록</title>
    <link rel="stylesheet" href="/assets/styles/common.css" type="text/css">
    <link rel="stylesheet" href="/assets/styles/fragments.css" type="text/css">
    <link rel="stylesheet" href="/assets/styles/index.css" type="text/css">
    <link rel="stylesheet" href="/board/assets/styles/list.css" type="text/css">
</head>
<body>
<th:block th:replace="~{/fragments/common.html :: topNavigator}"></th:block>
<th:block th:replace="~{/fragments/common.html :: sideMypage(user)}"></th:block>
<main id="main">
    <div class="error not-found" th:if="${board == null}">
        <h1 class="title">게시판</h1>
        <span class="message">존재하지 않는 게시판입니다. 주소를 다시 확인해 주세요.</span>
        <button name="back" type="button" data-object="button" data-color="concept">돌아가기</button>
    </div>
    <div class="content-wrapper" th:if="${board != null}">
        <div class="header">
            <h1 class="title">게시판</h1>
            <h2 class="board"></h2>
            <div class="sub-row">
                <h2 class="board" th:text="${board.getDisplayText()}"></h2>
                <div class="filter ">
                    <label><input type="checkbox"> 최신순</label>
                    <label><input type="checkbox"> 인기순</label>
                </div>
            </div>
        </div>

        <table class="table board-table">
            <thead class="section">
            <tr class="row">
                <th class="cell" scope="col">번호</th>
                <th class="cell -stretch" scope="col">제목</th>
                <th class="cell" scope="col">작성자</th>
                <th class="cell" scope="col">조회수</th>
                <th class="cell" scope="col">날짜</th>
            </tr>
            </thead>
            <tbody class="section">
            <tr class="row" th:each="article : ${articles}">
                <td class="cell title">
                    <div class="title-inner">
                        <div class="thumbnail">
                            <img src="/board/assets/images/icons8-airplane-50.png" alt="썸네일">
                        </div>
                        <div class="text">
                            <a class="link"
                            th:href="@{/article(id=${article.id})}"
                            th:text="${article.title}">
                                제목
                            </a>
                            <p class="preview" th:text="${#strings.abbreviate(article.content, 50)}">
                                미리보기
                            </p>
                        </div>
                    </div>
                </td>
                <td class="cell nickname" th:text="${article.nickname}"></td>
                <td class="cell view" th:text="${article.view}"></td>
                <td class="cell created_at"
                th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd')}"></td>
            </tr>
            <tr th:if="${articles == null || #arrays.isEmpty(articles)}">
                <td colspan="5" class="cell empty">
                    작성된 글이 없습니다.
                </td>
                <td class="cell nickname">유어박스</td>
                <td class="cell view">71</td>
                <td class="cell created_at">2026-01-16</td>
            </tr>
            </tbody>
        </table>
    </div>

    <form novalidate class="search-form" name="searchForm">
        <input hidden name="id" type="hidden" th:value="${board.getId()}">
        <label data-object="label" data-name="searchByLabel">
            <select required name="by" data-object="input" data-component="label.field">
                <option selected value="titleContent">제목 + 내용</option>
                <option value="title">제목</option>
                <option value="nickname">작성자</option>
            </select>
        </label>
        <label data-object="label">
            <input maxlength="25" minlength="0" name="keyword" placeholder="검색어를 입력해 주세요." data-object="input" data-component="label.field"
                   th:value="${boardSearchVo.getKeyword() != null ? boardSearchVo.getKeyword() : ''}">
        </label>
        <button class="button" type="submit" data-object="button" data-color="concept">검색</button>
    </form>
    <div class="page-container" th:if="${boardSearchVo.getBy() == null || boardSearchVo.getKeyword() == null}">
        <div class="group" th:if="${boardPageVo.requestPage > boardPageVo.minPage}">
            <a class="link" th:href="@{'/board/list' (id = ${board.id}, page = ${boardPageVo.minPage})}">&lt;&lt;</a>
            <a class="link" th:if="@{'/board/list' (id = ${board.id}, page = ${boardPageVo.requestPage - 1})}">&lt;</a>
        </div>
        <div class="group">
            <a th:each="page : ${#numbers.sequence(boardPageVo.startPage, boardPageVo.endPage)}"
            th:text="${page}"
            th:href="@{'/board/list' (id = ${board.id}, page = ${page})}"
            th:class="${page == boardPageVo.requestPage ? 'link -selexted' : 'link'}"></a>
        </div>
        <div class="group" th:if="${boardPageVo.requestPage < boardPageVo.maxPage}">
            <a class="link" th:href="@{'/board/list' (id = ${board.id}, page = ${boardPageVo.maxPage})}">&gt;&gt;</a>
            <a class="link" th:href="@{'/board/list' (id = ${board.id}, page = ${boardPageVo.requestPage + 1})}">&gt;</a>
        </div>
    </div>
    <div class="page-container" th:if="${boardSearchVo.getBy() != null || boardSearchVo.getKeyword() != null}">
        <div class="group" th:if="${boardPageVo.requestPage > boardPageVo.minPage}">
            <a class="link"
               th:href="@{'/board/list' (id = ${board.id}, page = ${boardPageVo.minPage}, by = ${boardSearchVo.by}, keyword = ${boardSearchVo.keyword})}">&lt;&lt;</a>
            <a class="link" th:href="@{'/board/list' (id = ${board.id}, page = ${boardPageVo.requestPage - 1}, by = ${boardSearchVo.by}, keyword = ${boardSearchVo.keyword})}">&lt;</a>
        </div>
        <div class="group">
            <a th:each="page : ${#numbers.sequence(boardPageVo.startPage, boardPageVo.endPage)}"
               th:text="${page}"
               th:href="@{'/board/list' (id = ${board.id}, page = ${page}, by = ${boardSearchVo.by}, keyword = ${boardSearchVo.keyword})}"
               th:class="${page == boardPageVo.requestPage ? 'link -selected' : 'link'}"></a>
        </div>
        <div class="group" th:if="${boardPageVo.requestPage < boardPageVo.maxPage}">
            <a class="link" th:href="@{'/board/list' (id = ${board.id}, page = ${boardPageVo.maxPage}, by = ${boardSearchVo.by}, keyword = ${boardSearchVo.keyword})}">&gt;&gt;</a>
            <a class="link" th:href="@{'/board/list' (id = ${board.id}, page = ${boardPageVo.requestPage + 1}, by = ${boardSearchVo.by}, keyword = ${boardSearchVo.keyword})}">&gt;</a>
        </div>
    </div>
</main>
</body>
</html>
